name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          # Posit's package manager serves Linux binaries, so renv::restore()
          # does not have to compile anything.
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # The site's pre-render step runs run_all.R, so the published pages are
      # always built from a fresh run of the analysis.
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
