name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys through the Pages artifact API rather than a gh-pages branch, so
# nothing has to exist before the first run. Set Settings > Pages > Source to
# "GitHub Actions" once.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          # Posit's package manager serves Linux binaries, so renv::restore()
          # does not have to compile anything.
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # The site's pre-render step runs run_all.R, so the published pages are
      # always built from a fresh run of the analysis.
      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
